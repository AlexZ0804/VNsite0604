<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Kiến Thức - Trắc Nghiệm</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client (使用 v2 版本) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div id="app-container" class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden fade-in">
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Kiểm Tra Kiến Thức</h1>
            <p class="text-indigo-200 text-sm mt-1">Thử thách bản thân ngay hôm nay!</p>
        </div>

        <!-- Content Area -->
        <div class="p-6">
            <!-- Start Screen -->
            <div id="start-screen" class="text-center space-y-6">
                <div class="py-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mx-auto text-indigo-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                    <p class="text-gray-600">Bạn đã sẵn sàng chưa? Bài kiểm tra bao gồm các câu hỏi trắc nghiệm thú vị.</p>
                </div>
                <!-- 这里的 onclick 必须对应 window.app.startQuiz -->
                <button onclick="window.app.startQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 transform hover:scale-105 shadow-md">
                    Bắt Đầu Ngay
                </button>
            </div>

            <!-- Quiz Screen (Hidden by default) -->
            <div id="quiz-screen" class="hidden">
                <div class="mb-4 flex justify-between items-center text-sm text-gray-500">
                    <span id="question-counter">Câu hỏi 1/5</span>
                    <span id="score-display">Điểm: 0</span>
                </div>
                <div class="mb-6">
                    <h2 id="question-text" class="text-xl font-semibold text-gray-800 mb-4">Nội dung câu hỏi sẽ hiện ở đây...</h2>
                    <div id="options-container" class="space-y-3">
                        <!-- Options will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Result Screen (Hidden by default) -->
            <div id="result-screen" class="hidden text-center">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Hoàn Thành!</h2>
                <p class="text-gray-600 mb-6">Kết quả của bạn là:</p>
                <div class="text-5xl font-bold text-indigo-600 mb-8" id="final-score">0</div>
                <button onclick="location.reload()" class="w-full border border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-bold py-3 px-6 rounded-lg transition duration-200">
                    Làm Lại
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION & INITIALIZATION ---
        // 注意：这里只定义一次 supabaseClient，避免 Identifier already declared 错误
        const SUPABASE_URL = 'https://yovquziroemazxptcsei.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_abBYW8JXL0BTjSA2Kf4d-A_uGBad2Gb';

        let supabaseClient = null;

        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('Supabase initialized successfully');
            } else {
                console.error('Supabase library not loaded.');
            }
        } catch (e) {
            console.error('Error initializing Supabase:', e);
        }

        // --- 2. APP LOGIC ---
        // 将 app 挂载到 window 对象上，确保全局可访问
        window.app = {
            currentQuestionIndex: 0,
            score: 0,
            questions: [
                {
                    question: "Thủ đô của Việt Nam là gì?",
                    options: ["TP. Hồ Chí Minh", "Hà Nội", "Đà Nẵng", "Huế"],
                    answer: 1 // Index of correct answer
                },
                {
                    question: "1 + 1 bằng mấy?",
                    options: ["1", "2", "3", "4"],
                    answer: 1
                },
                {
                    question: "Màu cờ Tổ quốc Việt Nam có màu gì?",
                    options: ["Xanh sao vàng", "Đỏ sao vàng", "Đỏ sao trắng", "Vàng sao đỏ"],
                    answer: 1
                }
            ],

            // DOM Elements
            elements: {
                startScreen: document.getElementById('start-screen'),
                quizScreen: document.getElementById('quiz-screen'),
                resultScreen: document.getElementById('result-screen'),
                questionText: document.getElementById('question-text'),
                optionsContainer: document.getElementById('options-container'),
                questionCounter: document.getElementById('question-counter'),
                scoreDisplay: document.getElementById('score-display'),
                finalScore: document.getElementById('final-score')
            },

            // Methods
            startQuiz: function() {
                console.log("Quiz Started!"); // Debug log
                this.currentQuestionIndex = 0;
                this.score = 0;
                this.showScreen('quiz');
                this.loadQuestion();
            },

            showScreen: function(screenName) {
                this.elements.startScreen.classList.add('hidden');
                this.elements.quizScreen.classList.add('hidden');
                this.elements.resultScreen.classList.add('hidden');

                if (screenName === 'start') this.elements.startScreen.classList.remove('hidden');
                if (screenName === 'quiz') this.elements.quizScreen.classList.remove('hidden');
                if (screenName === 'result') this.elements.resultScreen.classList.remove('hidden');
            },

            loadQuestion: function() {
                const q = this.questions[this.currentQuestionIndex];
                this.elements.questionText.textContent = q.question;
                this.elements.questionCounter.textContent = `Câu hỏi ${this.currentQuestionIndex + 1}/${this.questions.length}`;
                this.elements.scoreDisplay.textContent = `Điểm: ${this.score}`;

                this.elements.optionsContainer.innerHTML = '';

                q.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-4 rounded-lg border border-gray-200 hover:bg-indigo-50 hover:border-indigo-300 transition-colors";
                    btn.textContent = opt;
                    btn.onclick = () => this.handleAnswer(index);
                    this.elements.optionsContainer.appendChild(btn);
                });
            },

            handleAnswer: function(selectedIndex) {
                const q = this.questions[this.currentQuestionIndex];
                if (selectedIndex === q.answer) {
                    this.score += 10;
                }

                this.currentQuestionIndex++;

                if (this.currentQuestionIndex < this.questions.length) {
                    this.loadQuestion();
                } else {
                    this.endQuiz();
                }
            },

            endQuiz: function() {
                this.elements.finalScore.textContent = this.score;
                this.showScreen('result');

                // Optional: Save to Supabase if connected
                if (supabaseClient) {
                    this.saveResultToSupabase(this.score);
                }
            },

            saveResultToSupabase: async function(finalScore) {
                try {
                    const { data, error } = await supabaseClient
                        .from('quiz_results') // Ensure you have this table in Supabase
                        .insert([{ score: finalScore, language: 'vi' }]);
                    if (error) throw error;
                    console.log('Result saved:', data);
                } catch (err) {
                    console.warn('Could not save result to Supabase:', err.message);
                }
            }
        };

        // Initialize logic if needed on load
        document.addEventListener('DOMContentLoaded', () => {
            console.log("DOM Loaded. App Ready.");
        });

    </script>
</body>
</html>
