<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, maximum-scale=1.0, user-scalable=no">
    <title>Hệ thống trả lời câu hỏi thông minh - Chiến dịch Tiết kiệm Năng lượng Nhỏ LCFC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 全局字体大小调整 */
        body { font-size: 14px; }
        body { 
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            overflow: hidden; 
        }
        .glass-bg { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }
        .brand-text { color: #10b981; }
        .brand-bg { 
            background-image: linear-gradient(135deg, #059669 0%, #10b981 100%); 
        }
        .brand-bg:active { transform: scale(0.98); }
        .progress-bar-fill { 
            background: linear-gradient(90deg, #059669, #34d399, #059669); 
            background-size: 200% 100%; 
            animation: flowLight 2s linear infinite; 
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        @keyframes flowLight { 
            0% { background-position: 100% 0; } 
            100% { background-position: -100% 0; } 
        }
        .option-item { 
            transition: all 0.25s ease; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(15, 23, 42, 0.4); 
        }
        .option-item.selected { 
            background-color: rgba(16, 185, 129, 0.15); 
            border-color: #10b981; 
            box-shadow: inset 0 0 15px rgba(16, 185, 129, 0.1); 
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 sm:p-6 relative">
    <!-- 背景装饰 -->
    <div class="absolute top-[-15%] left-[-10%] w-96 h-96 bg-emerald-600/20 rounded-full mix-blend-screen filter blur-[100px] animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-80 h-80 bg-teal-600/20 rounded-full mix-blend-screen filter blur-[80px]"></div>
    
    <!-- 主容器 -->
    <div id="app-container" class="glass-bg w-full max-w-md rounded-3xl relative z-10 flex flex-col h-[85vh] max-h-[750px]">
        <!-- 登录页 -->
        <div id="page-login" class="flex-1 flex flex-col justify-center p-8 space-y-8 animate-fade-in">
            <div class="text-center space-y-3">
                <div class="mx-auto w-16 h-16 rounded-2xl bg-slate-800/80 border border-slate-700 flex items-center justify-center mb-4 shadow-lg">
                    <svg class="w-8 h-8 brand-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold tracking-widest text-white">ESG <span class="brand-text text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400">Tiên phong Không Carbon</span></h1>
                <p class="text-slate-400 text-sm tracking-wide">AI hỗ trợ · Phát hiện lãng phí ẩn tại nhà máy</p>
            </div>
            <div class="text-center bg-slate-800/40 py-4 rounded-xl border border-slate-700/50 backdrop-blur-sm">
                <p class="text-slate-400 text-xs tracking-widest mb-1">Thực tế hoàn thành</p>
                <div class="flex items-center justify-center text-2xl font-mono font-black text-white">
                    <span id="participant-count" class="mx-2 text-emerald-400 drop-shadow-[0_0_8px_rgba(16,185,129,0.5)]">0</span> Số người
                </div>
            </div>
            <div class="pt-4">
                <!-- 修复后可点击的按钮 -->
                <button onclick="app.startQuiz()" class="w-full brand-bg text-white font-bold py-3 rounded-xl shadow-[0_8px_20px_rgba(16,185,129,0.3)] transition-all text-base tracking-wider active:scale-95"> Bắt đầu thử thách </button>
            </div>
        </div>
        
        <!-- 问答页 -->
        <div id="page-quiz" class="hidden flex-1 flex flex-col p-6 sm:p-8">
            <!-- ... (中间题目逻辑保持不变) ... -->
        </div>
        
        <!-- 结果页 -->
        <div id="page-result" class="hidden flex-1 flex flex-col justify-center p-8 text-center space-y-4 relative">
            <!-- ... (结果页逻辑保持不变) ... -->
        </div>
    </div>

    <script>
        // 修复1: 填入真实的 Supabase 密钥 (从中文版复制)
        const SUPABASE_URL = 'https://yovquziroemazxptcsei.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_abBYW8JXL0BTjSA2Kf4d-A_uGBad2Gb';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const APP_CONFIG = {
            timeLimit: 120,
            passScore: 80,
            questions: [
                { type: 'single', title: "1. Chữ “E” trong ESG đại diện cho yếu tố Môi trường, “Phát thải carbon thấp” chủ yếu nhằm giảm phát thải loại khí nào？", options: ["Khí CO", "Khí CO₂", "Khí O₂"], correct: [1] },
                { type: 'single', title: "2. Nội dung nào dưới đây là biện pháp tiết kiệm năng lượng trong nhà máy? ", options: ["Để thiết bị chạy không tải mà không tắt máy.", "Tắt các thiết bị điện không cần thiết.", "Để đèn sáng liên tục không tắt."], correct: [1] },
                { type: 'single', title: "3. Thực hiện theo ESG: Tắt máy tính, đèn và điều hòa sau giờ làm việc là thói quen tốt giúp tiết kiệm năng lượng và giảm phát thải carbon.", options: ["Đúng", "Sai"], correct: [0] },
                { type: 'single', title: "4. Khi dây chuyền sản xuất không có người vận hành, việc vẫn để thiết bị chạy không tải là phù hợp với yêu cầu tiết kiệm năng lượng và giảm phát thải carbon.", options: ["Đúng", "Sai"], correct: [1] },
                { type: 'multi', title: "5. Những hành vi nào dưới đây được xem là hoạt động tiết kiệm năng lượng và giảm phát thải carbon theo ESG của doanh nghiệp？", options: ["Tắt đèn, tắt điều hòa khi ra khỏi phòng.", "Hạn chế để thiết bị vận hành không tải", "Để máy tính ở chế độ chờ trong thời gian dài sau giờ làm việc", "Tắt nguồn các thiết bị khi không sử dụng"], correct: [0, 1, 3] }
            ]
        };

        const app = {
            currentIndex: 0,
            score: 0,
            timeLeft: APP_CONFIG.timeLimit,
            timer: null,
            selectedOptions: [],
            totalQuestions: APP_CONFIG.questions.length,
            el: {
                pageLogin: document.getElementById('page-login'),
                pageQuiz: document.getElementById('page-quiz'),
                pageResult: document.getElementById('page-result'),
                timerDisplay: document.getElementById('timer-display'),
                qTitle: document.getElementById('question-title'),
                qType: document.getElementById('question-type'),
                oList: document.getElementById('options-list'),
                progressBar: document.getElementById('progress-bar'),
                progressText: document.getElementById('progress-text'),
                participantCount: document.getElementById('participant-count')
            },
            init: async function() {
                this.el.participantCount.innerText = "...";
                try {
                    const { count, error } = await supabase.from('vnsite').select('*', { count: 'exact', head: true });
                    if (error) throw error;
                    this.el.participantCount.innerText = count || 0;
                } catch (error) {
                    console.error('Lỗi khi lấy dữ liệu:', error.message);
                    this.el.participantCount.innerText = 0;
                }
            },
            startQuiz: function() {
                this.el.pageLogin.classList.add('hidden');
                this.el.pageQuiz.classList.remove('hidden');
                this.startTimer();
                this.renderQuestion();
            },
            // ... (其余方法保持不变) ...
            startTimer: function() { /* ... */ },
            updateTimerUI: function() { /* ... */ },
            renderQuestion: function() { /* ... */ },
            toggleOption: function(index) { /* ... */ },
            submitAnswer: function(forceEnd = false) { /* ... */ },
            endQuiz: async function() { /* ... */ }
        };

        // 修复2: 使用更稳健的 DOMContentLoaded 事件
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
